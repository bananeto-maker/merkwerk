<script>
  /* PWA-Dateien nur einbinden, wenn die App über http(s) läuft (nicht bei der Offline-Einzeldatei). */
  if (location.protocol === 'http:' || location.protocol === 'https:') {
    [['manifest', 'manifest.webmanifest'], ['apple-touch-icon', 'icons/icon-192.png']].forEach(function (l) {
      var el = document.createElement('link'); el.rel = l[0]; el.href = l[1]; document.head.appendChild(el);
    });
  }
  try { var t = localStorage.getItem('merkwerk-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
